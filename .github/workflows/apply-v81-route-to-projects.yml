name: Apply dashboard v81 route to Projects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-v81:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v81 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interey_v44.py')
          code = path.read_text(encoding='utf-8')

          if 'Versión v81 · RUTA DE CIERRE EN PROYECTOS' in code:
              print('v81 already applied.')
              raise SystemExit(0)

          required = [
              'Versión v80 · BACKLOG SOLO PROYECTOS',
              'render_backlog_coverage_strip(backlog, proj_fc, selected_year)',
              'grid-template-columns:1.35fr repeat(5,minmax(0,.78fr));',
              'ventas_sub = "Proyectos + Tienda"',
          ]
          missing = [x for x in required if x not in code]
          if missing:
              raise SystemExit('Expected v80 patterns not found: ' + repr(missing))

          # 1) La ruta de cierre tendrá una celda adicional: Meta Proyectos.
          code = code.replace(
              'grid-template-columns:1.35fr repeat(5,minmax(0,.78fr));',
              'grid-template-columns:1.35fr repeat(6,minmax(0,.72fr));',
              1
          )

          # 2) Hacer explícito que TODOS los KPI superiores del Resumen son consolidados.
          code = code.replace(
              '        ventas_sub = "Proyectos + Tienda"\n'
              '        utilidad_sub = f"Margen bruto: {fmt_pct(fc.get(\'margen_bruto_ytd\',0))}"\n'
              '        gastos_sub = "Administrativos cargados"\n'
              '        meta_sub = "Objetivo corporativo"',
              '        ventas_sub = "Proyectos + Tienda"\n'
              '        utilidad_sub = f"Proyectos + Tienda · Margen bruto: {fmt_pct(fc.get(\'margen_bruto_ytd\',0))}"\n'
              '        gastos_sub = "Proyectos + Tienda · Administrativos cargados"\n'
              '        meta_sub = "Objetivo corporativo consolidado"\n'
              '        gap_sub = f"vs meta consolidada {fmt_money(fc.get(\'meta_anual\',0))}"',
              1
          )

          # Subtítulos de Utilidad neta y Forecast también identifican el consolidado.
          code = code.replace(
              '(neta_label, fmt_money(fc["utilidad_neta_ytd"]), f"Margen neto: {fmt_pct(fc[\'margen_neto_ytd\'])}", net_style),\n'
              '            (forecast_label, fmt_money(fc["forecast_ventas"]), compliance_text(fc["cumplimiento"]), forecast_style),',
              '(neta_label, fmt_money(fc["utilidad_neta_ytd"]), f"{\'Proyectos + Tienda · \' if view_name == \'Consolidado\' else \'\'}Margen neto: {fmt_pct(fc[\'margen_neto_ytd\'])}", net_style),\n'
              '            (forecast_label, fmt_money(fc["forecast_ventas"]), f"{\'Consolidado · \' if view_name == \'Consolidado\' else \'\'}{compliance_text(fc[\'cumplimiento\'])}", forecast_style),',
              1
          )
          code = code.replace(
              '    with c4: st.markdown(card(neta_label, fmt_money(fc["utilidad_neta_ytd"]), f"Margen neto: {fmt_pct(fc[\'margen_neto_ytd\'])}", net_style), unsafe_allow_html=True)\n'
              '    with c5: st.markdown(card(forecast_label, fmt_money(fc["forecast_ventas"]), compliance_text(fc["cumplimiento"]), forecast_style), unsafe_allow_html=True)',
              '    with c4: st.markdown(card(neta_label, fmt_money(fc["utilidad_neta_ytd"]), f"{\'Proyectos + Tienda · \' if view_name == \'Consolidado\' else \'\'}Margen neto: {fmt_pct(fc[\'margen_neto_ytd\'])}", net_style), unsafe_allow_html=True)\n'
              '    with c5: st.markdown(card(forecast_label, fmt_money(fc["forecast_ventas"]), f"{\'Consolidado · \' if view_name == \'Consolidado\' else \'\'}{compliance_text(fc[\'cumplimiento\'])}", forecast_style), unsafe_allow_html=True)',
              1
          )

          # 3) Mostrar explícitamente la meta anual de Proyectos dentro de la ruta.
          marker = '''        <div class="backlog-cover-cell">\n            <div class="backlog-cover-kicker">Real + backlog</div>\n            <div class="backlog-cover-value {real_backlog_class}">{fmt_money_compact(real_plus_backlog)}</div>\n        </div>\n        <div class="backlog-cover-cell">\n            <div class="backlog-cover-kicker">Falta p/ forecast</div>'''
          replacement = '''        <div class="backlog-cover-cell">\n            <div class="backlog-cover-kicker">Real + backlog</div>\n            <div class="backlog-cover-value {real_backlog_class}">{fmt_money_compact(real_plus_backlog)}</div>\n        </div>\n        <div class="backlog-cover-cell">\n            <div class="backlog-cover-kicker">Meta Proyectos</div>\n            <div class="backlog-cover-value">{fmt_money_compact(meta)}</div>\n            <div class="backlog-cover-sub">Objetivo anual vigente</div>\n        </div>\n        <div class="backlog-cover-cell">\n            <div class="backlog-cover-kicker">Falta p/ forecast</div>'''
          if marker not in code:
              raise SystemExit('Route strip insertion point not found.')
          code = code.replace(marker, replacement, 1)

          # 4) Resumen Ejecutivo queda 100% consolidado; mover la ruta a Proyectos.
          summary_call = '''    if view_selected == "Resumen Ejecutivo":\n        render_backlog_coverage_strip(backlog, proj_fc, selected_year)\n\n        st.markdown('<div class="section-title">Trayectoria comercial consolidada</div>', unsafe_allow_html=True)'''
          summary_replacement = '''    if view_selected == "Resumen Ejecutivo":\n        st.markdown('<div class="section-title">Trayectoria comercial consolidada</div>', unsafe_allow_html=True)'''
          if summary_call not in code:
              raise SystemExit('Summary route call not found.')
          code = code.replace(summary_call, summary_replacement, 1)

          project_anchor = '''    elif view_selected == "Proyectos":\n        st.markdown('<div class="section-title">Unidad de negocio: Proyectos</div>', unsafe_allow_html=True)\n        trend_note("Esta vista muestra ventas mensuales, conciliación y desempeño comercial del equipo. Orlando Martínez y Ana Margarita Sahagún suman en KPIs corporativos, pero no participan en el comparativo de ingenieros.")\n\n        monthly_chart('''
          project_replacement = '''    elif view_selected == "Proyectos":\n        st.markdown('<div class="section-title">Unidad de negocio: Proyectos</div>', unsafe_allow_html=True)\n        trend_note("Esta vista muestra ventas mensuales, conciliación y desempeño comercial del equipo. Orlando Martínez y Ana Margarita Sahagún suman en KPIs corporativos, pero no participan en el comparativo de ingenieros.")\n\n        render_backlog_coverage_strip(backlog, proj_fc, selected_year)\n\n        monthly_chart('''
          if project_anchor not in code:
              raise SystemExit('Projects insertion point not found.')
          code = code.replace(project_anchor, project_replacement, 1)

          code = code.replace(
              '"Vista Dirección: Radar, seis KPIs esenciales, cobertura del backlog y trayectoria "\n'
              '                "comercial consolidada. El detalle mensual permanece en Análisis."',
              '"Vista Dirección: Radar, seis KPIs esenciales y trayectoria comercial consolidada. "\n'
              '                "La ruta de cierre del backlog se analiza dentro de Proyectos."',
              1
          )

          code = code.replace(
              'Versión v80 · BACKLOG SOLO PROYECTOS',
              'Versión v81 · RUTA DE CIERRE EN PROYECTOS',
              1
          )

          compile(code, str(path), 'exec')

          checks = {
              'Summary has no route': 'if view_selected == "Resumen Ejecutivo":\n        render_backlog_coverage_strip' not in code,
              'Projects has route': 'elif view_selected == "Proyectos":\n        st.markdown' in code and 'render_backlog_coverage_strip(backlog, proj_fc, selected_year)' in code,
              'Project target visible': '<div class="backlog-cover-kicker">Meta Proyectos</div>' in code,
              'Strip has six cells': 'grid-template-columns:1.35fr repeat(6,minmax(0,.72fr));' in code,
              'Gross profit consolidated label': 'Proyectos + Tienda · Margen bruto' in code,
              'Expenses consolidated label': 'Proyectos + Tienda · Administrativos cargados' in code,
              'Gap consolidated label': 'vs meta consolidada' in code,
              'v81 caption': 'Versión v81 · RUTA DE CIERRE EN PROYECTOS' in code,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))

          path.write_text(code, encoding='utf-8')
          print('v81 applied and syntax validated.')
          PY

      - name: Commit v81
        shell: bash
        run: |
          python -m py_compile interey_v44.py
          if git diff --quiet -- interey_v44.py; then
            echo 'No dashboard changes to commit.'
            exit 0
          fi
          git config user.name 'INTEREY Dashboard Automation'
          git config user.email 'actions@github.com'
          git add interey_v44.py
          git commit -m 'Mueve ruta de cierre a Proyectos y aclara KPIs consolidados'
          git push origin main
